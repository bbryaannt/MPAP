<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPAP</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#222;background:#fff;font:13px Arial,sans-serif;font-variant-numeric:tabular-nums}button,input,select{font:inherit}main{max-width:1200px;margin:auto;padding:12px}header{font-size:14px;margin-bottom:12px}section{margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid #ddd}h2{font-size:13px;font-weight:600;margin:0 0 7px}button,select,input{border:1px solid #aaa;background:#fff;border-radius:0;padding:3px 6px}button{cursor:pointer}button:disabled{color:#999;cursor:default}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 192px;gap:16px}.fields{display:grid;grid-template-columns:100px minmax(0,1fr);gap:5px}.fields span:nth-child(even){text-align:right;overflow-wrap:anywhere}.note,.muted{font-size:12px;color:#555;margin-top:5px}#error{color:#8a240d;white-space:pre-wrap}#plots{display:block;width:100%;height:320px}#log{display:flex;gap:4px;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 7px}#log button{font-size:12px}#inspect{font-size:12px;line-height:1.5}#thermal{width:auto;height:auto;max-width:192px;image-rendering:pixelated}#sessionInfo{overflow-wrap:anywhere}label{white-space:nowrap}[hidden]{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}#thermalPanel{grid-column:1/-1}}
</style><main><header>MPAP</header>
<section><h2>Setup</h2><div class="controls"><label>Mode <select id="mode"><option>Artifact Replay</option><option>Folder Simulation</option></select></label><label>G-code <input id="gcode" style="width:240px" placeholder="Local file path"></label><button id="chooseFile">Browse file</button></div><div class="controls" style="margin-top:6px"><label>Thermal folder <input id="folder" style="width:280px" placeholder="Local directory"></label><button id="chooseFolder">Browse folder</button><label>First index <input id="firstIndex" type="number" min="0" style="width:70px" placeholder="auto"></label><button id="start">Start</button><button id="stop">Stop</button></div><div id="sessionInfo" class="note"></div><div id="error" role="alert"></div></section>
<section id="replayControls"><div class="controls"><button id="play">Play</button><button id="step">Next frame</button><button id="reset">Reset</button><label>Rate <select id="speed"><option value="1">10 frames/s</option><option value="6">60 frames/s</option><option value="10" selected>100 frames/s</option><option value="100">1,000 frames/s</option></select></label><label>Go to frame <input id="target" type="number" min="0" step="1" value="0" style="width:85px"></label><button id="jump">Go</button><span id="transport"></span></div></section>
<div class="grid"><section><h2>Current frame</h2><div class="fields"><span>Frame</span><span id="progressText">0</span><span>Classification</span><span id="classification">—</span><span>Area [px²]</span><span id="area">—</span><span>Aspect ratio</span><span id="aspect">—</span><span>Band 3 [pixels]</span><span id="band">—</span></div></section><section><h2>Monitoring state</h2><div class="fields"><span>Monitoring</span><span id="monitoring">STOPPED</span><span>Thermal state</span><span id="phase">—</span><span>Transition</span><span>UNRESOLVED</span></div><div id="quality" class="note"></div></section><section id="thermalPanel" hidden><h2>Thermal intensity</h2><canvas id="thermal" aria-label="Current thermal intensity frame"></canvas></section></div>
<section><h2>Thermal plots — last 600 frames</h2><canvas id="plots" aria-label="Area, aspect ratio, Band 3 and classification over observed frames"></canvas></section>
<section><h2>Events — frame / event / stage</h2><ol id="log"></ol><div id="inspect">Select an event.</div></section></main>
<script>
let playing=false,busy=false,latest=null,selected=null;const $=id=>document.getElementById(id);const number=(x,d=0)=>x==null?'—':Number(x).toLocaleString(undefined,{maximumFractionDigits:d});
const colors={LASER_OFF:'#bbb',LOW_POWER:'#577b98',LOW_POWDER:'#a97b27',GOOD:'#537c55',HIGH_POWER:'#a04436',UNKNOWN:'#222'};
function plot(history){const c=$('plots'),w=c.clientWidth,h=c.clientHeight,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.font='11px Arial';ctx.fillStyle='#fafafa';ctx.fillRect(0,0,w,h);if(!history.length){ctx.fillStyle='#555';ctx.fillText('No frames consumed',80,35);return}const left=80,right=w-20,lo=history[0].frame,hi=history.at(-1).frame,span=Math.max(1,hi-lo+1),x=f=>left+(f-lo)*(right-left)/span,bw=(right-left)/span;
const tracks=[['area_px','Area [px²]'],['aspect_ratio','Aspect'],['band3','Band 3']];tracks.forEach(([key,label],i)=>{const top=16+i*(h-70)/3,bottom=top+(h-70)/3-24;const values=history.map(r=>r[key]),min=Math.min(...values),max=Math.max(...values),range=max-min||1;ctx.fillStyle='#222';ctx.fillText(label,0,top+10);ctx.fillText(number(max,2),0,top+25);ctx.fillText(number(min,2),0,bottom);for(const r of history)if(r.classification==='LASER_OFF'){ctx.fillStyle='#e0e0e0';ctx.fillRect(x(r.frame),top,Math.max(bw,1),bottom-top)}ctx.strokeStyle='#ccc';ctx.strokeRect(left,top,right-left,bottom-top);ctx.beginPath();history.forEach((r,j)=>{const px=x(r.frame)+bw/2,py=bottom-(r[key]-min)/range*(bottom-top);j?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.strokeStyle='#315b75';ctx.stroke();if(history.length===1){ctx.fillStyle='#315b75';ctx.fillRect(left,bottom-2,3,3)}});const y=h-43;ctx.fillStyle='#333';ctx.fillText('Class',0,y+10);for(const r of history){ctx.fillStyle=colors[r.classification];ctx.fillRect(x(r.frame),y,Math.max(bw,1),10)}ctx.fillStyle='#333';ctx.fillText(String(lo),left,h-12);ctx.textAlign='right';ctx.fillText(String(hi),right,h-12);ctx.textAlign='center';ctx.fillText('Frame index (observed prefix)',(left+right)/2,h-12);ctx.textAlign='left';}
function controls(){const live=latest?.mode==='Folder Simulation';const invalid=!latest||latest.data_quality!=='VALID';$('play').textContent=playing?'Pause':'Play';$('play').disabled=busy||invalid||latest?.finished;$('step').disabled=busy||playing||invalid||latest?.finished;$('reset').disabled=busy||!latest;$('jump').disabled=busy||invalid;$('target').disabled=busy||invalid;$('speed').disabled=busy||live;for(const id of ['play','step','reset','jump','target','speed'])if(live)$(id).disabled=true;for(const id of ['start','chooseFile','chooseFolder'])$(id).disabled=busy;$('stop').disabled=busy||!live||latest?.lifecycle==='STOPPED';$('replayControls').hidden=live;$('transport').textContent=latest?.finished?'Recording ended':playing?'Playing':'Paused';$('monitoring').textContent=latest?.error?'ERROR':live?({'DATA QUALITY ISSUE':'WAITING / GAP'})[latest.lifecycle]||latest.lifecycle:latest?.finished?'RECORDING ENDED':playing?'REPLAYING':'PAUSED'}
function render(s){if(!latest){$('mode').value=s.mode;$('gcode').value=s.gcode?.path||'';if(s.mode==='Folder Simulation'){$('folder').value=s.source;$('firstIndex').value=s.first_index??''}}latest=s;thermal(s.thermal);$('sessionInfo').textContent=`${s.mode} · G-code: ${s.gcode?.path||'not selected'}`;$('quality').textContent=s.mode==='Folder Simulation'?s.detail||'':'';$('error').textContent=s.error||'';$('progressText').textContent=`${number(s.frame)}${s.total_frames==null?'':' / '+number(s.total_frames)}`;const r=s.current;for(const [id,key,d] of [['area','area_px',1],['aspect','aspect_ratio',3],['band','band3',0]])$(id).textContent=number(r?.[key],d);$('classification').textContent=r?.classification||'—';$('phase').textContent=!r?'—':r.classification==='LASER_OFF'?'LASER_OFF':'ACTIVE';$('log').replaceChildren(...s.events.slice().reverse().map(e=>{const li=document.createElement('li');const b=document.createElement('button');b.textContent=`${e.decision_frame} / ${e.event_id} / ${e.stage}`;b.onclick=()=>{selected=e.event_id;inspect()};li.append(b);return li}));if(s.finished||s.error)playing=false;plot(s.history);inspect();controls()}
function thermal(t){$('thermalPanel').hidden=!t;if(!t)return;const c=$('thermal');c.width=t.width;c.height=t.height;const ctx=c.getContext('2d'),im=ctx.createImageData(t.width,t.height),raw=atob(t.pixels);for(let i=0;i<t.width*t.height;i++){im.data.set([raw.charCodeAt(i*3),raw.charCodeAt(i*3+1),raw.charCodeAt(i*3+2),255],i*4)}ctx.putImageData(im,0,0)}

function inspect(){const items=latest?.inspections||[];let e=items.find(x=>x.event_id===selected);if(!e){selected=null;$('inspect').textContent='Select an event.';return}const fmt=x=>x==null?'unavailable':number(x,3);$('inspect').textContent=`Event ${e.event_id} | ${e.status} | OFF start ${e.off_start} | end ${fmt(e.off_end)} | elapsed ${fmt(e.elapsed_off)} | completed ${fmt(e.completed_off)}. `+['T0','T1','T2','T3'].map(k=>`${k}: ${e.stages[k]==null?'unavailable':'frame '+e.stages[k]}`).join(' | ')+`. Pre-window n=${e.pre?.n??0}, area=${fmt(e.pre?.area_px_mean)}, aspect=${fmt(e.pre?.aspect_ratio_mean)}. Restart n=${e.restart_n}/10; Δarea=${fmt(e.delta_area_px)}, Δaspect=${fmt(e.delta_aspect_ratio)}, ΔBand3=${fmt(e.delta_band3)}. ${e.context}`}
async function choose(kind,id){if(busy)return;busy=true;controls();try{const r=await fetch('/choose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,session:latest.session,revision:latest.revision})});const d=await r.json();if(!r.ok)throw Error(d.error);if(d.path)$(id).value=d.path}catch(e){$('error').textContent=e.message}finally{busy=false;controls()}}
async function action(path,data){if(busy)return;busy=true;controls();try{const response=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,session:latest?.session,revision:latest?.revision})});const result=await response.json();if(response.status===409){playing=false;render(result.state);$('error').textContent=result.error}else if(!response.ok)throw Error(result.error||'Source failure');else if(JSON.stringify(result)!==JSON.stringify(latest))render(result)}catch(e){playing=false;$('error').textContent='Source error: '+e.message}finally{busy=false;controls()}}
$('play').onclick=()=>{playing=!playing;controls()};$('step').onclick=()=>action('/advance',{count:1});$('start').onclick=()=>{playing=false;selected=null;action('/start',{mode:$('mode').value,gcode:$('gcode').value,folder:$('folder').value,first_index:$('firstIndex').value===''?null:Number($('firstIndex').value)})};$('stop').onclick=()=>action('/stop',{});$('chooseFile').onclick=()=>choose('file','gcode');$('chooseFolder').onclick=()=>choose('folder','folder');$('reset').onclick=()=>{playing=false;selected=null;action('/reset',{})};$('jump').onclick=()=>{playing=false;selected=null;action('/jump',{frame:Number($('target').value)})};setInterval(()=>{if(latest?.mode==='Folder Simulation'&&!busy){action('/state');return}if(playing&&!busy)action('/advance',{count:Number($('speed').value)})},100);window.addEventListener('resize',()=>plot(latest?.history||[]));action('/state');
</script></html>
